quarkus:
  openapi:
    generator:
      server:
        use: openapitools
        base-package: xyz.kajih.jexapi
camel:
  component:
    jms:
      username: "{{mq_app_user:app}}"   # Camel's default syntax is key:default
      password: "{{mq.app.password}}"
      transacted: true
  debug:
    jmxConnectorEnabled: false

mq:
  channel: DEV.APP.SVRCONN
  host: localhost
  port: 1414
  queue-manager: QM1
